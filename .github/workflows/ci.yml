name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Python CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies (if present)
        run: |
          # try both common filenames (your repo has requirement.txt)
          if [ -f requirement.txt ]; then
            echo "Found requirement.txt -> installing"
            pip install -r requirement.txt
          elif [ -f requirements.txt ]; then
            echo "Found requirements.txt -> installing"
            pip install -r requirements.txt
          else
            echo "No requirements file found, continuing"
          fi

      - name: Lint with flake8 (non-blocking)
        run: |
          pip install flake8
          # run flake8 but don't fail pipeline on lint issues for now
          flake8 || echo "flake8 reported issues (non-blocking)"

      - name: Syntax check (compile)
        run: python -m compileall .

      - name: Run tests (if present)
        run: |
          if [ -f pytest.ini ] || [ -d tests ]; then
            echo "Tests found → running pytest"
            pip install pytest
            pytest -q
          else
            echo "No tests detected → skipping pytest"
          fi
