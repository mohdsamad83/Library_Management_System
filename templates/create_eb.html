<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create_EBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>
    <div >
        <div class="sign_card">
            <h1>Create EBook</h1>


            <div class="form_card">
                <form action="" method="post">
                    <div class="mb-3">
                        <label for="bname" class="form-label">Enter Book Name</label>
                        <input type="text" class="form-control" id="bname" placeholder="Eg: Atomic Habits">
                    </div>
                    <div class="mb-3">
                        <label for="author" class="form-label">Author Name</label>
                        <input type="text" class="form-control" id="author" placeholder="Eg: James Clear">
                    </div>
                    <div class="mb-3">
                        <label for="b_url" class="form-label">URL</label>
                        <input type="" class="form-control" id="b_url" placeholder="Eg: https://...">
                    </div>
                    <div class="submit_botton">
                        <button type="submit" class="btn btn-primary">Add </button>
                        
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
