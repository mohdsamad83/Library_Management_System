<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>
    <div class="sign_in">
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Welcome Admin</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    </ul>
                    <form class="d-flex">
                        <button class="btn btn-outline-secondary" type="submit">logout</button>
                    </form>
                </div>
            </div>
        </nav>
        <div id="book_button">
            <a href="create_eb.html" class="btn btn-outline-primary">Add a new book</a>
            <!-- <button type="button" class="btn btn-outline-primary">Add a new book</button> -->
        </div>
        <div class=" req_books_admin content_main">
            <h1> Requested books by user </h1>

            <div id="content">

                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Book Name</th>
                            <th scope="col">Author</th>
                            <th scope="col">Requested User</th>
                            <th scope="col">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <th scope="row">1</th>
                            <td>Atomic Habits</td>
                            <td>James Clear</td>
                            <td>#Username 1</td>
                            <td>
                                <a href="" class="btn btn-outline-success">Grant</a>
                            </td>
                        </tr>
                        <tr>
                            <th scope="row">2</th>
                            <td>Zero to One</td>
                            <td>Peter Thiel & Blake Masters</td>
                            <td>#Username 2</td>
                            <td>
                                <a href="" class="btn btn-outline-success">Grant</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="summary_head ">
            <h1> Summary </h1>
            <div class="summary ">
                <div class="individual_summary ">
                    <h1>Total Users</h1>
                    <h3>#101</h3>
                </div>
                <div class="individual_summary">
                    <h1>Requested books</h1>
                    <h3>#55</h3>
                </div>
                <div class="individual_summary">
                    <h1>Available</h1>
                    <h3>#5</h3>
                </div>
                <div class="individual_summary">
                    <h1>Granted</h1>
                    <h3>#30</h3>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
