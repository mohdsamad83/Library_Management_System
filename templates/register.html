<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign_up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>
    <div class="sign_up">
        <div class="sign_card">
            <h1>Welcome <br>
                Sign up </h1>


            <div class="form_card">
                <form action="/register" method="post">
                    <div class="mb-3">
                        <label for="email" class="form-label">Enter your email</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="Eg: mohdsamad83@gmail.com">
                    </div>
                    <div class="mb-3">
                        <label for="username" class="form-label">Create username</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Eg: samad123">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Set your password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="************">
                    </div>
                    <div class="submit_botton">
                        <button type="submit" class="btn btn-primary">Sign up</button>
                        <br>
                        To sign in <a href="/login">click here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
